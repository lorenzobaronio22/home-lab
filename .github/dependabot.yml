version: 2
updates:
  - package-ecosystem: helm
    directory: "/03.k3s-cluster/01.networking/tailscale-operator"
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      tailscale-operator:
        patterns:
          - "tailscale-operator"
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "main"
    schedule:
      interval: monthly
      day: saturday
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: "/02.docker-host/01.networking"
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      cloudflare-tunnel:
        patterns:
          - "*"
