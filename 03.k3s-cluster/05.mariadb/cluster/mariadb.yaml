# No spec.bootstrapFrom: the Gem Garden database was migrated once from a
# logical dump and the PVC has been live since. Recovery is now PhysicalBackup
# only (bootstrapFrom.backupRef) - see README.md.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: mariadb
  labels:
    app.kubernetes.io/name: mariadb
spec:
  image: mariadb:11.4
  imagePullPolicy: IfNotPresent
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: root-password
  storage:
    size: 10Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5
    exec:
      command:
        - bash
        - -c
        - mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}"
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    exec:
      command:
        - bash
        - -c
        - mariadb-admin ping -u root -p"${MARIADB_ROOT_PASSWORD}"