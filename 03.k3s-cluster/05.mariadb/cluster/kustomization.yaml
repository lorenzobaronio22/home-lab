apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mariadb
resources:
  # mariadb.yaml is intentionally absent for one commit: spec.bootstrapFrom is
  # immutable, so dropping the block requires pruning the CR and re-adding it.
  # The StatefulSet's PVC (storage-mariadb-0) is retained on delete, and
  # mariadb.yaml is restored in the following commit.
  - physical-backup.yaml
  # One Database/User/Grant triple per WordPress site sharing this server.
  - apps/gemgarden