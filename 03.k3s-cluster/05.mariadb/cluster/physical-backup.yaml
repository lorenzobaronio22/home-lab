# Nightly physical backup (mariadb-backup) of the shared MariaDB instance to
# OCI object storage. Mirrors the CNPG ScheduledBackup convention (03:00 UTC).
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: physicalbackup-gemgarden
  namespace: mariadb
spec:
  mariaDbRef:
    name: mariadb
  schedule:
    cron: "0 3 * * *"
    suspend: false
    immediate: true
  compression: gzip
  maxRetention: 336h
  storage:
    s3:
      bucket: k3s-wordpress-backups
      prefix: gemgarden/backups
      endpoint: axwwei3movpa.compat.objectstorage.eu-milan-1.oraclecloud.com
      region: us-east-1
      accessKeyIdSecretKeyRef:
        name: wordpress-s3-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: wordpress-s3-backup-creds
        key: SECRET_ACCESS_KEY
      tls:
        enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi