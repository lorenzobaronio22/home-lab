# mariadb-operator controller + validating webhook (certificates managed by the
# bundled cert-controller, no cert-manager dependency). Cluster-wide watch.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb-operator
spec:
  dependsOn:
    - name: mariadb-operator-crds
  interval: 30m
  timeout: 10m
  releaseName: mariadb-operator
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  install:
    createNamespace: true
  chart:
    spec:
      chart: mariadb-operator
      version: "26.10.1"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
      interval: 1h
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi