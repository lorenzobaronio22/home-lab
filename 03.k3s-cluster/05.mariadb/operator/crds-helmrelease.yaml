# Installs the mariadb-operator CRDs as a standalone chart. Must be managed
# independently from the operator chart: uninstalling it deletes every MariaDB
# instance. The operator HelmRelease dependsOn this one so CRDs exist first.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: mariadb-operator
spec:
  interval: 30m
  timeout: 10m
  releaseName: mariadb-operator-crds
  targetNamespace: mariadb-operator
  storageNamespace: mariadb-operator
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "26.10.1"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
      interval: 1h