---
# cert-manager is a prerequisite of the barman-cloud plugin (plugin TLS certs).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: networking
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: 03.k3s-cluster/02.cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases
  namespace: flux-system
spec:
  dependsOn:
    - name: networking
    - name: cert-manager
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: 03.k3s-cluster/03.postgres
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres
      namespace: postgres
