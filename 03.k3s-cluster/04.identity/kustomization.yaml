apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Upstream operator manifest kustomization does not emit the namespace, so it
  # is created here. Only the operator package is applied synchronously (its
  # CRDs are required by ./keycloak, which is rendered by its own Flux
  # Kustomization).
  - namespace.yaml
  - ./keycloak-operator