# Renders the Keycloak CR + ingress once the operator (and its CRDs) are
# installed by the "keycloak-operator" Kustomization. This object is applied by
# the parent 04.identity/ apply (single-file include) and is NOT listed in
# keycloak/kustomization.yaml so the Kustomization does not manage itself.
# It renders 03.k3s-cluster/04.identity/keycloak (CRs only).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  dependsOn:
    - name: keycloak-operator
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  path: 03.k3s-cluster/04.identity/keycloak
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  healthChecks:
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      name: keycloak
      namespace: keycloak