apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tailscale
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  # ProxyGroup last: its CRD is installed by the chart above. If applied before
  # the CRD exists, kustomize-controller simply retries until the release is up.
  - proxygroup.yaml
configMapGenerator:
  - name: tailscale-operator-values
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
