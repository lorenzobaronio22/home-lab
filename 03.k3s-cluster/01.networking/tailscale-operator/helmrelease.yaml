apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  storageNamespace: tailscale
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.2"
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-operator-values
      valuesKey: values.yaml
    - kind: Secret
      name: tailscale-operator-oauth
      valuesKey: client-id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-operator-oauth
      valuesKey: client-secret
      targetPath: oauth.clientSecret
