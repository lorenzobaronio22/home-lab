image:
  repository: cloudflare/cloudflared
  tag: "2026.8.2"
  pullPolicy: IfNotPresent

replicaCount: 1

metricsPort: 2000
loglevel: info
output: json

# Injected at render time from the cloudflared-tunnel-token Secret via valuesFrom.
tunnel:
  token: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi