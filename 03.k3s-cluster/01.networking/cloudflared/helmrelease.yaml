apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 30m
  timeout: 10m
  releaseName: cloudflared
  targetNamespace: cloudflared
  storageNamespace: cloudflared
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./03.k3s-cluster/01.networking/cloudflared
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: cloudflared-tunnel-token
      valuesKey: token
      targetPath: tunnel.token