apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cnpg-operator
  # HelmRelease only. The ObjectStore CR lives in workload/: its CRD is
  # created by this chart, and kustomize-controller's upfront dry-run would
  # reject the whole Kustomization if the CR were applied here too early.
  - barman-plugin
