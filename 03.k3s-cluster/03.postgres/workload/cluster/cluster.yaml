apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 1
  # Generate the <name>-superuser Secret (postgres/postgres superuser creds);
  # consumed by the pgweb client below.
  enableSuperuserAccess: true
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: oci-backup
