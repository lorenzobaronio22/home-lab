apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: oci-backup
  namespace: postgres
spec:
  retentionPolicy: 14d
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
      # boto needs a region; us-east-1 works for any OCI region because the
      # endpointURL selects it.
      - name: AWS_REGION
        value: us-east-1
  configuration:
    # Shared backup bucket for the whole home lab; workloads are isolated by
    # prefix. Barman appends the cluster name, so postgres lands under
    # postgres/{base,wals}/ (mariadb-operator uses mariadb/ instead).
    endpointURL: https://axwwei3movpa.compat.objectstorage.eu-milan-1.oraclecloud.com
    destinationPath: s3://homelab-backups/
    s3Credentials:
      accessKeyId:
        name: homelab-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: homelab-backup-creds
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
