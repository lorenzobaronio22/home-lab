apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  dependsOn:
    - name: cloudnative-pg
  interval: 30m
  timeout: 10m
  releaseName: plugin-barman-cloud
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.7.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 1h
