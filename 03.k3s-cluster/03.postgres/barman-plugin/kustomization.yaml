apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # HelmRelease lives in cnpg-system and reuses the cloudnative-pg
  # HelmRepository declared in ../cnpg-operator (same namespace).
  # The ObjectStore CR lives in ../workload/: its CRD is created by this
  # chart, and kustomize-controller's upfront dry-run would reject the whole
  # Kustomization if the CR were applied before the chart is installed.
  - helmrelease.yaml
